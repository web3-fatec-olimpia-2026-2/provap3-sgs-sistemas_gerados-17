<text x='142.5' y='348' font-size='15' fill='#111827' font-weight='700' text-anchor='middle' font-family='JetBrains Mono, Consolas, Menlo, monospace' >Σ = 4.118</text>
<text x='142.5' y='368' font-size='12' fill='#4B5563' font-weight='400' text-anchor='middle' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >soma ponderada</text>
<path d='M249 351 h18' stroke='#4B5563' stroke-width='2' marker-end='url(#seta)'/>
<rect x='273' y='320' width='205' height='62' rx='6' fill='#F3F4F6' stroke='#D1D5DB' stroke-width='1' />
<text x='375.5' y='348' font-size='15' fill='#111827' font-weight='700' text-anchor='middle' font-family='JetBrains Mono, Consolas, Menlo, monospace' >4.118 mod 79 = 10</text>
<text x='375.5' y='368' font-size='12' fill='#4B5563' font-weight='400' text-anchor='middle' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >resto r (0 … 78)</text>
<path d='M482 351 h18' stroke='#4B5563' stroke-width='2' marker-end='url(#seta)'/>
<rect x='506' y='320' width='205' height='62' rx='6' fill='#FEF3C7' stroke='#92400E' stroke-width='1' />
<text x='608.5' y='348' font-size='15' fill='#111827' font-weight='700' text-anchor='middle' font-family='JetBrains Mono, Consolas, Menlo, monospace' >d1 = 10 div 9 + 1 = 2</text>
<text x='608.5' y='368' font-size='12' fill='#4B5563' font-weight='400' text-anchor='middle' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >1º verificador</text>
<path d='M715 351 h18' stroke='#4B5563' stroke-width='2' marker-end='url(#seta)'/>
<rect x='739' y='320' width='205' height='62' rx='6' fill='#FEF3C7' stroke='#92400E' stroke-width='1' />
<text x='841.5' y='348' font-size='15' fill='#111827' font-weight='700' text-anchor='middle' font-family='JetBrains Mono, Consolas, Menlo, monospace' >d2 = 10 mod 9 + 1 = 2</text>
<text x='841.5' y='368' font-size='12' fill='#4B5563' font-weight='400' text-anchor='middle' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >2º verificador</text>
<text x='40' y='430' font-size='14' fill='#111827' font-weight='700' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >Resultado: os verificadores entram nas posições 6 e 7</text>
<text x='40' y='468' font-size='30' fill='#111827' font-weight='700' text-anchor='start' font-family='JetBrains Mono, Consolas, Menlo, monospace' >K12W-F22M-T5R-Q7L</text>
<text x='420' y='460' font-size='13' fill='#4B5563' font-weight='400' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >Por que 79?  É primo e maior que a maior diferença entre dois</text>
<text x='420' y='478' font-size='13' fill='#4B5563' font-weight='400' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >caracteres (25). Com pesos distintos e não nulos mód. 79, toda troca</text>
<text x='420' y='496' font-size='13' fill='#4B5563' font-weight='400' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >de 1 caractere e toda transposição mudam o resto: detecção garantida.</text>
