<text x='630' y='316' font-size='11' fill='#4B5563' font-weight='400' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >ordenável; Crockford Base32</text>
<text x='630' y='344' font-size='12' fill='#6B7280' font-weight='700' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >KSUID</text>
<text x='630' y='360' font-size='11' fill='#4B5563' font-weight='400' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >ordenável (segundos); Base62</text>
<text x='630' y='388' font-size='12' fill='#2563EB' font-weight='700' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >UUID v4 / v7</text>
<text x='630' y='404' font-size='11' fill='#4B5563' font-weight='400' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >padrão IETF (RFC 9562); v7 ordenável</text>
<text x='630' y='432' font-size='11' fill='#111827' font-weight='600' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >LNNL: menor texto com verificação,</text>
<text x='630' y='448' font-size='11' fill='#111827' font-weight='600' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >ao custo de espaço e de ordenação.</text>
