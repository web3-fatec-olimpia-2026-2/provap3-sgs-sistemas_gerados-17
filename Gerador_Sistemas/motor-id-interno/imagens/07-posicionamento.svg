<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 560' width='960' height='560' role='img' aria-labelledby='t'>
<title id='t'>Posicionamento do LNNL entre UUID e Snowflake</title>
<rect width='100%' height='100%' fill='#FFFFFF'/>
<text x='40' y='40' font-size='20' fill='#111827' font-weight='700' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >Onde o LNNL se encaixa: esforço humano × espaço amostral</text>
<text x='40' y='66' font-size='13' fill='#4B5563' font-weight='400' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >Eixo X: caracteres que uma pessoa lê ou dita. Eixo Y: bits não fixos do identificador (capacidade).</text>
