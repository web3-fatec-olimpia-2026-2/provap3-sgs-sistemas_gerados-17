<text x='630' y='96' font-size='14' fill='#111827' font-weight='700' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >Características</text>
<text x='630' y='124' font-size='12' fill='#047857' font-weight='700' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >LNNL</text>
<text x='630' y='140' font-size='11' fill='#4B5563' font-weight='400' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >verificador e tipo embutidos; sem ordem</text>
<text x='630' y='168' font-size='12' fill='#6B7280' font-weight='700' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >TSID</text>
<text x='630' y='184' font-size='11' fill='#4B5563' font-weight='400' text-anchor='start' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif' >ordenável no tempo; Crockford Base32</text>
