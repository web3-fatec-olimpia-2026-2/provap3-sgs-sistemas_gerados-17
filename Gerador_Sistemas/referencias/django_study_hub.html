/* Cópia estática: entrega ao app.js os JSON embutidos acima no lugar de fetch('./data/<nome>.json'). */
(function () {
  var original = window.fetch;
  window.fetch = function (url) {
    var m = /^\.\/data\/([\w-]+)\.json$/.exec(String(url));
    var el = m && document.getElementById('dsh-dados-' + m[1]);
    if (el) return Promise.resolve(new Response(el.textContent, {headers: {'Content-Type': 'application/json'}}));
    return original ? original.apply(this, arguments) : Promise.reject(new Error('sem fetch'));
  };
})();
</script>

function searchBox(value=''){return `<div class="search-wrap"><div class="search-box"><span class="search-icon">⌕</span><input id="search" type="search" autocomplete="off" aria-label="Pesquisar na documentação" placeholder="O que você quer fazer? Busque um conceito, comando ou dúvida..." value="${esc(value)}"><span class="keycap">/</span></div></div>`}
function normalize(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9_.]+/g,' ').trim()}
function distance(a,b){if(Math.abs(a.length-b.length)>2)return 3;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
function search(query){let q=normalize(query);let stop=new Set(['o','a','os','as','de','do','da','um','uma','como','que','para','no','na','com','eu','qual','funcao']);let words=q.split(' ').filter(w=>w&&!stop.has(w));if(!words.length)return [];return entries.map(e=>{let fields=[[e.title,7],[(e.keywords||[]).concat(e.synonyms||[]).join(' '),6],[e.code,5],[e.description,2],[catName(e.category),1],[didatica[e.id]?.location?.file||'',3],[didatica[e.id]?.scenario||'',1]];let score=0,matched=0;for(let w of words){let best=0;for(let [text,weight] of fields){let f=normalize(text),tokens=f.split(/\s+/);if(tokens.some(t=>t===w))best=Math.max(best,weight*3);else if(w.length>2&&tokens.some(t=>t.startsWith(w)||w.startsWith(t)&&t.length>3))best=Math.max(best,weight*2);else if(w.length>=4&&tokens.some(t=>t.length>=4&&distance(t,w)<=1))best=Math.max(best,weight)}if(best){matched++;score+=best}}let key=normalize(e.keywords.join(' '));if(key.includes(q)&&q.length>3)score+=30;if(normalize(e.title).includes(q))score+=25;score*=.45+.55*(matched/words.length);return {e,score}}).filter(x=>x.score>3).sort((a,b)=>b.score-a.score).slice(0,12)}
function updateSearch(){let q=$('#search')?.value.trim();let target=$('#search-results');if(!target)return;if(!q){target.innerHTML='';return}let found=search(q);target.innerHTML=`<p class="results-count">${found.length} resultado(s) para “${esc(q)}” · pesquisa local</p><div class="listing">${found.length?found.map(x=>resultCard(x.e)).join(''):'<div class="empty-state">Nenhum resultado encontrado. Tente termos mais curtos ou um sinônimo.</div>'}</div>`;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{let hist=storage.get('queries',[]).filter(x=>x!==q);storage.set('queries',[q,...hist].slice(0,15))},700)}
function p3home(){return `<div class="article"><div class="breadcrumbs">${link('/','Início')} / Modo Prova P3</div><div class="eyebrow">Guia de preparação</div><h1>Modo Prova P3</h1><p class="article-lead">O caminho completo do banco à API. Siga a ordem dos oito entregáveis do diagrama e adapte o exemplo de quartos ao tema recebido.</p><div class="notice warn"><strong>Regra da avaliação:</strong> os PDFs informam prova individual, 120 minutos, sem IA e com consulta somente à documentação oficial. Este hub é material de estudo; não presuma que seu uso seja permitido durante a prova.</div><div class="notice"><strong>Foco da turma:</strong> ORM e templates foram os pontos de maior dificuldade na revisão. O diagrama pede um ou mais testes passando; este guia apresenta três, um por camada.</div><details class="tree-disclosure"><summary>Ver estrutura de pastas e arquivos</summary>${projectTree()}</details><p>${link('/guia','Abrir o projeto guiado desde uma pasta vazia →','button')}</p><h2 style="font-family:Georgia;font-weight:500;margin-top:32px">Antes de começar</h2><p class="article-lead">Exemplo didático em Django 5.2, com DRF 3.16 e pytest-django. É preciso instalar os pacotes em um ambiente Python. Estes comandos são para o projeto de exemplo, não para usar o Study Hub.</p>${codeBlock('python -m venv .venv\n# Ative o ambiente virtual; veja o módulo Introdução\npython -m pip install "Django>=5.2,<5.3" "djangorestframework>=3.16,<3.17" pytest pytest-django\ndjango-admin startproject resort .\npython manage.py startapp quartos','bash',{file:'Não é arquivo: terminal',folder:'exemplo/ (nova pasta de projeto)',action:'Execute em sequência após ativar o ambiente virtual; startproject resort . requer um diretório de projeto sem colisões.',responsibility:'Instala dependências e cria os arquivos iniciais do projeto e do app.'})}<p class="article-lead">Adicione <code>quartos</code> e <code>rest_framework</code> a INSTALLED_APPS. O exemplo completo no repositório já contém esses arquivos. Para um projeto criado do zero, siga as etapas abaixo.</p><div class="step-list">${steps.map(s=>`<a class="step" href="#/p3/${s.number}"><span class="step-number">${String(s.number).padStart(2,'0')}</span><span><strong>${esc(s.title)}</strong><small>${esc(s.files)}</small></span><span class="arrow">→</span></a>`).join('')}</div><div class="notice">A entrega no Forms pede código e prints da tela HTML, do JSON da API e dos testes. Confirme o enunciado recebido e as instruções do professor.</div>${link('/simulado','Praticar no simulado →','button primary')}</div>`}
const exercises=[['Model + migração','No setor de passeios, você adicionou o campo vagas ao model. Que comandos registram e aplicam a mudança?','python manage.py makemigrations\npython manage.py migrate','makemigrations gera a migração; migrate a aplica ao banco.','makemigrations'],['URLs','Crie a rota de detalhe /passeios/5/ passando id à view detalhe_passeio.','path("passeios/<int:id>/", views.detalhe_passeio, name="detalhe")','A rota deve estar incluída no URLconf do projeto.','path'],['Views','Na view, busque Passeio pelo id e retorne 404 quando não existir.','passeio = get_object_or_404(Passeio, id=id)','Importe get_object_or_404 de django.shortcuts.','detail'],['ORM','Liste passeios com vagas maiores que zero.','Passeio.objects.filter(vagas__gt=0)','__gt significa maior que. Um resultado vazio não gera exceção.','filter'],['Template','A view envia {"passeios": passeios}. Como percorrer os nomes?','{% for p in passeios %}\n  {{ p.nome }}\n{% empty %}\n  Sem passeios.\n{% endfor %}','A variável deve ter o mesmo nome da chave do contexto.','for'],['Forms','Como rejeitar vagas menores que 1 no ModelForm?','def clean_vagas(self):\n    vagas = self.cleaned_data["vagas"]\n    if vagas < 1:\n        raise forms.ValidationError("Mínimo: 1 vaga.")\n    return vagas','A validação é executada pelo formulário; save do model não a chama.','clean'],['API','Que peças conectam Passeio ao endpoint REST?','PasseioSerializer → PasseioViewSet → router.register("passeios", PasseioViewSet)','Inclua router.urls no URLconf e teste GET e POST.','router'],['Testes','Escreva uma verificação para uma resposta de listagem.','response = client.get("/passeios/")\nassert response.status_code == 200','Para acessar banco, marque o teste com pytest.mark.django_db.','test-client']];

 if(['views','urls','orm','templates','forms'].includes(c))return `<div class="route-map"><strong>Arquivo físico × URL</strong><p>O navegador pede <code>/quartos/</code> (uma URL). <code>exemplo/resort/urls.py</code> inclui <code>exemplo/quartos/urls.py</code>, que chama a função em <code>exemplo/quartos/views.py</code>. O navegador não acessa o arquivo Python diretamente.</p></div>`;

 if(e.category==='drf')return ['Cliente HTTP pede /api/quartos/','resort/urls.py → router','quartos/api.py → ViewSet + Serializer','models.py / ORM ↔ SQLite','Resposta HTTP com JSON'];
 if(e.category==='testes')return ['pytest descobre o arquivo test_*.py','Teste usa model ou client de teste','client percorre URLs e view quando há requisição','assert confere o resultado'];
 if(e.category==='forms')return ['Navegador envia POST','quartos/urls.py → views.py','views.py instancia o form em forms.py','is_valid() valida → save() grava se válido','view redireciona ou devolve erros ao template'];

}

 <h2 id="explicacao">Entenda cada parte</h2><p>${esc(d.breakdown)}</p>${d.lines?.length?`<ul class="explain-list">${d.lines.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<h2 id="conexao">Conexão com os outros arquivos</h2><p>${esc(d.connection)}</p>${flowHTML(e)}
 <h2 id="resultado">Execução e resultado esperado</h2><p>${esc(e.when)} ${esc(d.expected)}</p><h2 id="erros">Erros comuns e soluções</h2><div class="notice">${esc(e.error)}</div><h2 id="pratique">Pratique</h2><div class="practice-box">${esc(d.practice)}</div>
 ${e.related?.length?`<h2>Continue aprendendo</h2><div class="actions-row">${e.related.map(item).filter(Boolean).map(r=>link('/doc/'+r.id,esc(r.title)+' →','button')).join('')}</div>`:''}<h2 id="fonte">Documentação oficial</h2><p><a class="source-link" href="${esc(e.source)}" target="_blank" rel="noopener">Abrir referência ↗</a> · ${esc(e.version)}</p><div class="prev-next">${prev?link('/doc/'+prev.id,'← '+esc(prev.title),'button'):''}${next?link('/doc/'+next.id,esc(next.title)+' →','button'):link('/modulo/'+e.category,'Voltar ao módulo','button')}</div></div>
 <aside class="article-aside"><strong>NESTA PÁGINA</strong><a href="#problema" data-scroll="problema">O problema</a><a href="#conceito" data-scroll="conceito">Conceito e contexto</a><a href="#prerequisitos" data-scroll="prerequisitos">Pré-requisitos</a><a href="#codigo" data-scroll="codigo">Código e localização</a><a href="#explicacao" data-scroll="explicacao">Entenda cada parte</a><a href="#conexao" data-scroll="conexao">Conexões</a><a href="#resultado" data-scroll="resultado">Resultado</a><a href="#erros" data-scroll="erros">Erros comuns</a><a href="#pratique" data-scroll="pratique">Pratique</a></aside></div></article>`;
}
function modulePage(id){let c=categories.find(x=>x.id===id);if(!c)return notFound();let n=categories.indexOf(c)+1,items=entries.filter(x=>x.category===id),seen=storage.get('seen',[]),visited=items.filter(x=>seen.includes(x.id)).length;return `<div class="article"><div class="breadcrumbs">${link('/','Início')} / Módulo ${String(n).padStart(2,'0')}</div><div class="eyebrow">Módulo ${String(n).padStart(2,'0')} · ${esc(c.label)}</div><h1>${esc(c.title)}</h1><p class="article-lead">Conceitos, sintaxes e exemplos para consultar enquanto você constrói sua aplicação.</p><div class="progress-label"><span>${visited} de ${items.length} assuntos visitados neste navegador</span><span>${Math.round(100*visited/items.length)}%</span></div><div class="progress-track"><span style="width:${100*visited/items.length}%"></span></div><p class="results-count">Visitar um assunto registra a leitura; não significa conclusão ou domínio.</p><div class="listing">${items.map(resultCard).join('')}</div></div>`}
function p3step(n){let s=steps.find(x=>x.number===Number(n));if(!s)return notFound();let e=item(s.related),d=didatica[s.related];return `<article class="article"><div class="breadcrumbs">${link('/','Início')} / ${link('/p3','Modo Prova P3')} / Etapa ${s.number}</div><div class="eyebrow">Modo prova · etapa ${String(s.number).padStart(2,'0')} de 08</div><h1>${esc(s.title)}</h1><p class="article-lead">${esc(d.scenario)}</p><div class="notice"><strong>O que é pedido:</strong> ${esc(s.description)}<br><strong>Pré-requisitos:</strong> ${esc(d.prerequisites)} ${link('/guia','Ver preparação completa →','source-link')}</div>${routeContext(e)}<details class="tree-disclosure"><summary>Ver árvore do projeto de exemplo</summary>${projectTree(d.location.file)}</details><div class="article-content">${s.sections.map(x=>{let c=p3Context[`${s.number}/${x.label}`];return `<h2>${esc(x.label)}</h2><p>${esc(x.text)}</p>${x.code?codeBlock(x.code,x.language,c?.location):''}${c?`<p class="code-explainer"><strong>Como funciona:</strong> ${esc(c.breakdown)}</p>`:''}`}).join('')}<h2>Conexão com os outros arquivos</h2><p>${esc(d.connection)}</p>${flowHTML(e)}<h2>Continue estudando</h2><div class="actions-row">${s.number>1?link('/p3/'+(s.number-1),'← Etapa anterior','button'):link('/p3','← Voltar ao índice','button')}${link('/doc/'+s.related,'Aprofundar no módulo →','button')}<a class="button" href="${esc(s.source)}" target="_blank" rel="noopener">Documentação oficial ↗</a>${s.number<8?link('/p3/'+(s.number+1),'Próxima etapa →','button primary'):link('/simulado','Ir para o simulado →','button primary')}</div></div></article>`}
function quick(){return `<div class="article"><div class="breadcrumbs">${link('/','Início')} / Consulta rápida</div><div class="eyebrow">Módulo 10 · referência</div><h1>Consulta rápida</h1><p class="article-lead">Uma cola para encontrar a estrutura e o seu lugar no projeto. Os caminhos são os da arquitetura adotada no exemplo, não regras universais.</p>${link('/guia','Ver organização e fluxo completos →','button')}${categories.map(c=>`<h2 style="font-family:Georgia;font-weight:500;margin:30px 0 12px">${esc(c.title)}</h2><div class="table-wrap"><table><thead><tr><th>O que fazer</th><th>Código / estrutura</th><th>Onde fica neste exemplo</th></tr></thead><tbody>${entries.filter(x=>x.category===c.id).map(e=>`<tr><td>${link('/doc/'+e.id,esc(e.title),'source-link')}</td><td><code>${esc(e.code.split('\n')[0])}</code></td><td><code>${esc(didatica[e.id]?.location.file||'Consulte o tópico')}</code></td></tr>`).join('')}</tbody></table></div>`).join('')}</div>`}
function practiceLocation(e){let d=didatica[e[4]],l={...d.location};if(e[0]==='API')return {file:'Não é arquivo: diagrama de fluxo',folder:'Projeto hipotético de passeios',action:'Leia a sequência; não copie como Python.',responsibility:'Explica a relação entre serializer, ViewSet e router.'};l.file=l.file.replaceAll('quartos','passeios');l.folder=l.folder.replaceAll('quartos','passeios');l.action+=' Para o cenário deste exercício, adapte o nome do aplicativo, imports e entidade.';return l}
function simulator(){return `<div class="article"><div class="breadcrumbs">${link('/','Início')} / Simulado</div><div class="eyebrow">Pratique sem pressa</div><h1>Simulado P3</h1><p class="article-lead">Imagine que você está desenvolvendo o setor de passeios do resort. Responda antes de revelar a solução.</p><div class="notice warn">Para ensaiar a regra da prova, tente sozinho e consulte somente a documentação oficial. Os campos não são corrigidos automaticamente.</div>${exercises.map((e,i)=>`<section class="exercise"><h3>${String(i+1).padStart(2,'0')} · ${esc(e[0])}</h3><p>${esc(e[1])}</p><textarea aria-label="Resposta para ${esc(e[0])}" placeholder="Escreva sua resposta aqui..."></textarea><details><summary>Revelar solução</summary>${codeBlock(e[2],i===0?'bash':i===4?'html':i===6?'text':'python',practiceLocation(e))}<p>${esc(e[3])} ${link('/doc/'+e[4],'Revisar conceito →','source-link')}</p></details></section>`).join('')}</div>`}
function guidePage(){return `<article class="article guide"><div class="breadcrumbs">${link('/','Início')} / Projeto guiado</div><div class="eyebrow">Do projeto vazio à aplicação</div><h1>Construa o sistema de quartos.</h1><p class="article-lead">Uma sequência completa: crie a pasta, organize os arquivos e conecte a listagem, o formulário, a API e os testes. Use uma pasta nova para não sobrescrever outro projeto.</p><div class="notice warn">O exemplo é didático e local. A API não configura autenticação para produção. Durante a prova, siga as regras do professor sobre fontes permitidas.</div>${projectTree()}<h2 class="guide-heading">Como uma listagem chega ao navegador</h2>${flowHTML({category:'views'})}${routeContext({category:'views'})}<div class="guide-toc"><strong>NESTA JORNADA</strong><p>${guia.length} passos · Django 5.2 · DRF 3.16 · pytest-django</p><div>${guia.map((g,i)=>`<a href="#guia-${i+1}" data-scroll="guia-${i+1}">${String(i+1).padStart(2,'0')} ${esc(g.title)}</a>`).join('')}</div></div><div class="article-content">${guia.map((g,i)=>`<section class="guide-step" id="guia-${i+1}"><div class="eyebrow">Passo ${String(i+1).padStart(2,'0')}</div><h2>${esc(g.title)}</h2><p>${esc(g.scenario)}</p><div class="notice"><strong>Pré-requisitos:</strong> ${esc(g.prereq)}</div>${g.parts.map(part=>`<h3 class="subheading">${esc(part.title)}</h3><p>${esc(part.text)}</p>${codeBlock(part.code,part.language,part.location)}<p class="code-explainer"><strong>Entenda:</strong> ${esc(part.explain)}</p>`).join('')}<div class="expected"><strong>Resultado esperado</strong><p>${esc(g.result)}</p></div></section>`).join('')}</div><div class="actions-row">${link('/p3','Revisar os oito entregáveis →','button primary')}${link('/consulta','Abrir consulta rápida →','button')}</div></article>`}

function render(){let p=hash().split('/').filter(Boolean),content,title='Visão geral';if(!p.length)content=home();else if(p[0]==='doc'){content=docPage(p[1]);title=item(p[1])?.title||'Conteúdo'}else if(p[0]==='modulo'){content=modulePage(p[1]);title=catName(p[1])}else if(p[0]==='p3'){content=p[1]?p3step(p[1]):p3home();title='Modo Prova P3'}else if(p[0]==='consulta'){content=quick();title='Consulta rápida'}else if(p[0]==='guia'){content=guidePage();title='Projeto guiado'}else if(p[0]==='simulado'){content=simulator();title='Simulado'}else if(p[0]==='favoritos'){content=favorites();title='Favoritos'}else if(p[0]==='historico'){content=historyPage();title='Histórico'}else content=notFound();$('#main').innerHTML=content;$('#top-location').textContent=title;sidebar();window.scrollTo(0,0);closeMenu()}
function closeMenu(){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false')}
function focusSearch(q=''){if(hash()!=='/'){location.hash='#/';setTimeout(()=>focusSearch(q),50);return}let input=$('#search');if(input){input.value=q;input.focus();updateSearch()}}
document.addEventListener('click',async ev=>{let b=ev.target.closest('button,a');if(!b)return;if(b.dataset.module){let id=b.dataset.module;let el=b.closest('.module');el.classList.toggle('open');let on=el.classList.contains('open');on?openModules.add(id):openModules.delete(id);b.setAttribute('aria-expanded',on);b.querySelector('.chev').textContent=on?'−':'+'}if(b.dataset.scroll){ev.preventDefault();document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'smooth'})}if(b.hasAttribute('data-copy')){let text=b.closest('.code-block').querySelector('code').textContent;try{await navigator.clipboard.writeText(text);showToast('Código copiado!')}catch{try{let t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove();showToast('Código copiado!')}catch{showToast('Não foi possível copiar. Selecione o código manualmente.')}}}if(b.dataset.favorite){let id=b.dataset.favorite,a=storage.get('favorites',[]);storage.set('favorites',a.includes(id)?a.filter(x=>x!==id):[id,...a]);render();showToast(a.includes(id)?'Removido dos favoritos':'Salvo nos favoritos')}if(b.dataset.query)focusSearch(b.dataset.query);if(b.dataset.historic)focusSearch(b.dataset.historic);if(b.hasAttribute('data-clear')){storage.set('recent',[]);storage.set('queries',[]);render();showToast('Histórico apagado')} });
document.addEventListener('input',e=>{if(e.target.id==='search')updateSearch()});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();focusSearch()}});
$('#menu-toggle').addEventListener('click',()=>{let on=$('#sidebar').classList.toggle('open');$('#overlay').classList.toggle('open',on);$('#menu-toggle').setAttribute('aria-expanded',on)});$('#overlay').addEventListener('click',closeMenu);
$('#theme-toggle').addEventListener('click',()=>{let dark=document.body.classList.toggle('dark');storage.set('dark',dark);$('#theme-toggle').textContent=dark?'☀':'☾'});
if(storage.get('dark',false)){document.body.classList.add('dark');$('#theme-toggle').textContent='☀'}
window.addEventListener('hashchange',render);
Promise.all(['categories','intro','models','urls','views','orm','templates','forms','drf','testes','prova-p3','didatica','guia','p3-context'].map(async f=>{let r=await fetch('./data/'+f+'.json');if(!r.ok)throw new Error(f);return r.json()})).then(([c,...rest])=>{categories=c;p3Context=rest.pop();guia=rest.pop();didatica=rest.pop();steps=rest.pop();entries=rest.flat();render()}).catch(err=>{$('#main').innerHTML=`<div class="article"><h1>Não foi possível carregar a base.</h1><p>Abra o site por um servidor HTTP. Arquivos JSON podem ser bloqueados ao abrir index.html diretamente pelo sistema de arquivos.</p><p>${esc(err.message)}</p></div>`});

</script>
</body>
