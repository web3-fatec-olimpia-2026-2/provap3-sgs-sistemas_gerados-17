{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0C0C0C">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{% static 'pharns/icone-192.png' %}">
  <link rel="stylesheet" href="{% static 'pharns/css/estilo.css' %}">
  <title>{% block title %}Pharmas{% endblock %}</title>
</head>
<body>
  <header class="cmd-topo"><a href="{% url 'pharns:lista' %}">Pharmas</a></header>
  <main>
    <h1>{% block page_title %}Pharmas{% endblock %}</h1>
    {% block page_subtitle %}{% endblock %}
    <button type="button" class="alternar" data-alternar-apresentacao>ocultar notas de apresentação</button>
    {% block toolbar_actions %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'pharns/js/app.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
