{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{% static 'atendimentos/icone-192.png' %}">

  <title>{% block title %}Pet Shop{% endblock %}</title>
</head>
<body>

  <main>
    <h1>{% block page_title %}Pet Shop{% endblock %}</h1>
    {% block page_subtitle %}{% endblock %}

    {% block toolbar_actions %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'atendimentos/js/app.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
